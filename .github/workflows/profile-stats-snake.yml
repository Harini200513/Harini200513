name: Update GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # GitHub Stats - Pink Theme
      # ─────────────────────────────────────
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Harini200513&show_icons=true&hide_border=true&title_color=EF93C4&icon_color=FF69B4&text_color=F8BBD0&bg_color=161616
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # Top Languages - Pink Theme
      # ─────────────────────────────────────
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Harini200513&layout=compact&langs_count=6&hide_border=true&title_color=EF93C4&icon_color=FF69B4&text_color=F8BBD0&bg_color=161616
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # Contribution Snake - Pink Theme
      # ─────────────────────────────────────
      - name: Generate Pink Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Harini200513
          outputs: |
            profile/github-snake.svg?color_snake=%23FF69B4&color_dots=%23161616,%233A2431,%237A4160,%23BD6D9B,%23EF93C4
            profile/github-snake-dark.svg?color_snake=%23FF69B4&color_dots=%23161616,%233A2431,%237A4160,%23BD6D9B,%23EF93C4

      # ─────────────────────────────────────
      # Commit Generated Images
      # ─────────────────────────────────────
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile graphics" || exit 0

          git push
